"<h3>3) index.html va style.css ni ulash</h3><p>Ulash <code>&lt;head&gt;</code> ichidagi <code>&lt;link&gt;</code> orqali boʻladi. <code>href</code> — CSS fayl yoʻli. Fayl boshqa papkada yoki nomi xato boʻlsa, dizayn ishlamaydi.</p>"+c("/* style.css */\nbody { background: #eef; }\nh2   { color: royalblue; }")+

"<h3>7) Izohlar</h3>"+c("<!-- HTML izohi -->\n/* CSS izohi */")+

"<h3>9) Amaliy topshiriq</h3><p>Oʻz papkangizda index.html va style.css yarating. Sahifada ism (h2), qiziqish (h3), 2 ta paragraf, hr va br ishlating. CSS da fon va sarlavha rangini oʻzgartiring. Test topshirishdan oldin buni bajaring.</p>"+

function tryTest(){if(!S.read[0]){alert("Avval darsni oʻqing.");return}startQ(0)}
function startQ(k){quiz={k:k,qs:Q.slice().sort(function(){return Math.random()-.5}),i:0,a:[],done:false};tab="quiz";render()}
function quizHTML(){var z=quiz;if(z.done){var ok=z.pct>=70;return "<div class='win' style='text-align:center'><div class='big "+(ok?"ok":"no")+"'>"+z.pct+"%</div><p>"+(ok?"Ajoyib! Keyingi dars ochildi.":"70% dan kam. 1-darsni qayta oʻqing.")+"</p>"+(ok?"<button class='pri' onclick='go(\"home\")'>Davom etish</button>":"<button class='pri' onclick='S.read[0]=0;save();go(\"home\")'>Darsni qayta oʻqish</button>")+"</div>"}
